# Grafana is the single entry point to metrics, logs and alerts. It does its
# own login against authentik (OIDC), so no forward-auth SecurityPolicy here.
#
# Prometheus and Alertmanager are not exposed: their UIs have no login, and
# everything they show is available in Grafana (Explore, Alerting). For a
# quick look at their own UIs:
#   kubectl port-forward -n monitoring svc/kube-prometheus-stack-prometheus 9090
#   kubectl port-forward -n monitoring svc/kube-prometheus-stack-alertmanager 9093
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
      namespace: envoy-gateway
  hostnames:
    - grafana.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: kube-prometheus-stack-grafana
          port: 80
