# Harbor is not behind authentik forward-auth: the registry API negotiates
# tokens over HTTP and would break (see Phase 08).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor-ui
  namespace: harbor
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - harbor.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: harbor
          port: 80
