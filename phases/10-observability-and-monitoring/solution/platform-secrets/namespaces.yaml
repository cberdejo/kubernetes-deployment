# Namespaces that receive a SealedSecret from this layer. They live here, not
# with their HelmReleases in platform/, because that layer depends on this
# one: a SealedSecret cannot be applied to a namespace that
# does not exist yet, and Flux applies Namespaces before any other object.
apiVersion: v1
kind: Namespace
metadata:
  name: authentik
  labels:
    expose-via-gateway: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: harbor
  labels:
    expose-via-gateway: "true"
---
# node-exporter needs the host network, PID namespace and filesystem.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    expose-via-gateway: "true"
