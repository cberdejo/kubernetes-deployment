apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  # The ServiceMonitor below needs the Prometheus Operator CRDs, which are
  # installed by another HelmRelease of this same layer.
  dependsOn:
    - name: prometheus-operator-crds
      namespace: kube-system
  releaseName: cert-manager
  chartRef:
    kind: OCIRepository
    name: cert-manager
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
      # Deleting the HelmRelease must never delete every Certificate in the cluster.
      keep: true
    # Scraped by Prometheus (monitoring/kube-prometheus-stack): certificate expiry and readiness.
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
