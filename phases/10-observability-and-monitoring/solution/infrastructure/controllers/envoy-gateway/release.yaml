apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway
spec:
  interval: 30m
  releaseName: envoy-gateway
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  install:
    # The chart ships the Gateway API and Envoy Gateway CRDs in crds/.
    # CreateReplace keeps them up to date on upgrades (plain Helm never does).
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    deployment:
      envoyGateway:
        resources:
          limits:
            cpu: 700m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
