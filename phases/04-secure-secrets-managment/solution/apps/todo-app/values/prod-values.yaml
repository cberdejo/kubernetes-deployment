global:
  imagePullSecrets: []

frontend:
  replicaCount: 1
  image:
    repository: "docker.io/your-dockerhub-user/todo-frontend"
    tag: "1.0.0"
  imagePullPolicy: IfNotPresent
  containerPort: 80
  service:
    type: NodePort
    port: 3000
    targetPort: 80
    nodePort: 30080
  config:
    viteApiUrl: "/api/v1"
    backendUpstream: ""
  # No Gateway API in Phase 04 (that arrives in Phase 06) — expose via NodePort.
  gatewayRoute:
    enabled: false
  auth:
    enabled: false

backend:
  replicaCount: 1
  image:
    repository: "docker.io/your-dockerhub-user/todo-backend"
    tag: "1.0.0"
  imagePullPolicy: IfNotPresent
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  config:
    host: "0.0.0.0"
    port: "8080"
    postgresHost: ""
    postgresPort: "5432"

postgres:
  replicaCount: 1
  image:
    repository: postgres
    tag: "15.10"
  imagePullPolicy: IfNotPresent
  containerPort: 5432
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
  secretName: "todo-db-secret"
  # Phase 04 supplies the database Secret OUT-OF-BAND as a SealedSecret
  # (bootstrap/seal-credentials.sh seals it and commits the encrypted blob).
  # Setting existingSecret makes the canonical chart consume that Secret and
  # skip its own in-cluster bootstrap hook. That hook is the Phase 05+ pattern;
  # this is the manual-SealedSecret stage of the secrets progression.
  existingSecret: "todo-db-secret"
  persistence:
    enabled: true
    size: 1Gi
    accessModes:
      - ReadWriteOnce
    # No Longhorn yet in Phase 04 (that's Phase 05). k3s ships "local-path".
    storageClassName: "local-path"
