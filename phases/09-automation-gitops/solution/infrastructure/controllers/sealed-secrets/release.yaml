apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets
  namespace: kube-system
spec:
  interval: 30m
  releaseName: sealed-secrets
  chart:
    spec:
      chart: sealed-secrets
      version: 2.18.3
      sourceRef:
        kind: HelmRepository
        name: sealed-secrets
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Same stable name as Phase 04, so kubeseal --controller-name keeps working.
    fullnameOverride: sealed-secrets
