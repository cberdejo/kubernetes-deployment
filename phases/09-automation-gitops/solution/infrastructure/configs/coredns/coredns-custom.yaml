# k3s-specific: CoreDNS imports every "*.server" key of this ConfigMap as an
# extra server block. It lets pods (Flux source-controller, image-reflector)
# resolve harbor.local: /etc/hosts on your laptop is invisible to the cluster.
#
# The zones are the exact hostnames on purpose: a generic "local" zone would
# also capture *.cluster.local and break every in-cluster DNS lookup.
#
# On Talos or other distros, adapt this to their CoreDNS customisation method.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  homelab.server: |
    harbor.local todo.local authentik.local longhorn.local {
        errors
        cache 30
        hosts {
            ${GATEWAY_IP} harbor.local todo.local authentik.local longhorn.local
        }
    }
