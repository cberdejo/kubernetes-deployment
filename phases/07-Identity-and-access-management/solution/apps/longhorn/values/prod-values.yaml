longhorn:
  persistence:
    defaultClassReplicaCount: 1
  defaultSettings:
    defaultReplicaCount: '{"v1":"1","v2":"1"}'
  preUpgradeChecker:
    jobEnabled: false
gatewayRoute:
  enabled: true
  hostname: "longhorn.local"
  gateway:
    name: public-gateway
    namespace: envoy-gateway
  pathPrefix: /
  backendService: longhorn-frontend
auth:
  enabled: true
  path: /outpost.goauthentik.io/auth/envoy
  headersToExtAuth:
    - cookie
    - authorization
  backend:
    serviceName: authentik-server
    namespace: authentik
    port: 80
  headersToBackend:
    - x-authentik-username
    - x-authentik-groups
    - x-authentik-entitlements
    - x-authentik-email
    - x-authentik-name
    - x-authentik-uid
