{{- if and .Values.postgres.bootstrap.enabled (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "todo-app.fullname" . }}-postgres-secret-bootstrap
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-secret-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "todo-app.fullname" . }}-postgres-secret-bootstrap
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-secret-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-9"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "todo-app.fullname" . }}-postgres-secret-bootstrap
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-secret-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-8"
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ include "todo-app.fullname" . }}-postgres-secret-bootstrap
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "todo-app.fullname" . }}-postgres-secret-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "todo-app.fullname" . }}-postgres-secret-bootstrap
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-secret-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "todo-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres-secret-bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "todo-app.fullname" . }}-postgres-secret-bootstrap
      containers:
        - name: create-secret
          image: {{ .Values.postgres.bootstrap.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              secret_name={{ include "todo-app.databaseSecretName" . | quote }}
              namespace={{ .Release.Namespace | quote }}
              postgres_host={{ default (printf "%s-postgres" (include "todo-app.fullname" .)) .Values.backend.config.postgresHost | quote }}
              postgres_user={{ .Values.postgres.bootstrap.credentials.user | quote }}
              postgres_password={{ default "" .Values.postgres.bootstrap.credentials.password | quote }}
              postgres_db={{ .Values.postgres.bootstrap.credentials.database | quote }}

              validate_uri_safe() {
                value="$1"
                name="$2"
                if [ -z "$value" ]; then
                  echo "$name must not be empty" >&2
                  exit 1
                fi
                case "$value" in
                  *[!A-Za-z0-9._~-]*)
                    echo "$name must only contain URI-safe characters: A-Z a-z 0-9 . _ ~ -" >&2
                    exit 1
                    ;;
                esac
              }

              if kubectl get secret "$secret_name" -n "$namespace" >/dev/null 2>&1; then
                echo "Secret $secret_name already exists; leaving existing credentials unchanged."
                exit 0
              fi

              validate_uri_safe "$postgres_user" POSTGRES_USER
              validate_uri_safe "$postgres_db" POSTGRES_DB

              # An omitted or empty password means "generate once". If the
              # Secret already exists, the early exit above preserves it.
              if [ -z "$postgres_password" ]; then
                postgres_password="$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32 || true)"
                if [ -z "$postgres_password" ]; then
                  echo "Failed to generate POSTGRES_PASSWORD" >&2
                  exit 1
                fi
              else
                validate_uri_safe "$postgres_password" POSTGRES_PASSWORD
              fi

              # DATABASE_URI is assembled without percent-encoding, so user,
              # password, and database are intentionally restricted above.
              database_uri="postgres://${postgres_user}:${postgres_password}@${postgres_host}:5432/${postgres_db}"

              kubectl create secret generic "$secret_name" \
                -n "$namespace" \
                --from-literal=POSTGRES_USER="$postgres_user" \
                --from-literal=POSTGRES_PASSWORD="$postgres_password" \
                --from-literal=POSTGRES_DB="$postgres_db" \
                --from-literal=DATABASE_URI="$database_uri"
{{- end }}
